<!DOCTYPE html>
<html lang="en-US">
  <head>
    <title>Demo P5 Library</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.10.0/p5.min.js"></script>
  </head>
  <body>
    <script>
      /* global p5 */
      const sketch = (p) => {
        p.setup = () => {
          p.createCanvas(450, 450)
          p.background(216, 169, 235)
        }

        p.draw = () => {
          p.fill(182, 235, 169)
          p.rect(p.mouseX, p.mouseY, 50, 50)
        }
      }
      new p5(sketch)
    </script>
  </body>
</html>
